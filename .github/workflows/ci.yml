name: Policy checks

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  nix-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Show flake outputs
        run: nix flake show --show-trace
      - name: Build package
        run: nix build .#packages.x86_64-linux.default --show-trace
      - name: Evaluate NixOS module
        run: |
          nix eval --raw --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              configuration = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.default
                  ({ ... }: {
                    system.stateVersion = "26.05";
                    services.ctxAgent.enable = true;
                    services.ctxAgent.operatorUsers = [ "testuser" ];
                    users.users.testuser.isNormalUser = true;
                  })
                ];
              };
            in configuration.config.systemd.services.ctx-agent.serviceConfig.ExecStart
          '
