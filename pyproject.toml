[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-agent"
version = "0.1.0"
description = "Sandboxed local task agent for NixOS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ctx-agent = "ctx_agent.cli:main"
ctx-agent-server = "ctx_agent.server:main"

[tool.setuptools.packages.find]
include = ["ctx_agent*"]
